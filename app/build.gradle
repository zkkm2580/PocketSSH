plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ---------------------------------------------------------------------------
// Release signing material.
//
// The repository ships a *demo* keystore so that both CI and local builds
// produce identically signed, installable release APKs. Replace it with your
// own key before publishing anything you care about.
// ---------------------------------------------------------------------------
def keystoreDir = rootProject.file('keystore')
def keystorePropsFile = new File(keystoreDir, 'keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def releaseKeystoreFile = new File(keystoreDir, 'release.jks')
def hasReleaseSigning = releaseKeystoreFile.exists() &&
        keystoreProps.getProperty('storePassword') != null &&
        keystoreProps.getProperty('keyAlias') != null

android {
    namespace 'com.zkkm.pocketssh'
    compileSdk 34

    defaultConfig {
        applicationId "com.zkkm.pocketssh"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.0.2"

        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseKeystoreFile
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword', keystoreProps.getProperty('storePassword'))
            }
        }
    }

    buildTypes {
        release {
            // JSch relies on reflection for crypto provider lookup, so keep R8 off
            // for a predictable, always-working release build.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xjvm-default=all']
    }

    buildFeatures {
        buildConfig = true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Maintained fork of JSch with modern KEX/ciphers and Ed25519 key support.
    implementation 'com.github.mwiede:jsch:0.2.20'

    testImplementation 'junit:junit:4.13.2'
}
